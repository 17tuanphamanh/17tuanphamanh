name: Activity card

on:
  schedule:
    - cron: "17 20 * * *"   # daily, 03:17 Hanoi time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - assets/fonts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python scripts/activity.py
      - name: Commit when the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg profile/activity-dark.svg
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update activity card"
          git push origin HEAD:${{ github.ref_name }}
