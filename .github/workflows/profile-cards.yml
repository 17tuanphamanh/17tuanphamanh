name: Profile cards

# Builds the stats, languages and snake images shown in the profile README and commits them
# to this repo, so the README never depends on a public card service being up.
on:
  schedule:
    - cron: "17 20 * * *"   # 03:17 Hanoi time
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=stars,issues,contribs&show=prs_merged,prs_merged_percentage&hide_rank=true&include_all_commits=true&hide_border=true&bg_color=00000000&title_color=2563EB&icon_color=2563EB&text_color=334155
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=stars,issues,contribs&show=prs_merged,prs_merged_percentage&hide_rank=true&include_all_commits=true&hide_border=true&bg_color=00000000&title_color=60A5FA&icon_color=60A5FA&text_color=C9D1D9
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=html,css,jupyter%20notebook,tex,makefile,dockerfile&hide_border=true&bg_color=00000000&title_color=2563EB&text_color=334155
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=html,css,jupyter%20notebook,tex,makefile,dockerfile&hide_border=true&bg_color=00000000&title_color=60A5FA&text_color=C9D1D9
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#2563EB&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            profile/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#0c2d6b,#1e40af,#2563eb,#60a5fa

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --staged --quiet && exit 0
          git commit -m "Update profile cards"
          git push origin HEAD:${{ github.ref_name }}
